/* ============================================================
   PAINEL DE PROGRESSO
   ============================================================ */
function computeAreaStats(){
  const map = {};
  DATA.forEach(e=>{
    const key = e.s+'|||'+e.site;
    if(!map[key]) map[key] = {section:e.s, site:e.site, total:0, c0:0, c1:0, c2:0};
    const m = map[key];
    m.total++;
    const r = getReview(e.id);
    if(r===0) m.c0++; else if(r===1) m.c1++; else m.c2++;
  });
  return Object.values(map).map(m=> Object.assign(m, {pct0:m.c0/m.total, pct1:m.c1/m.total, pct2:m.c2/m.total}));
}
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildAreaRow(label, stats, onStart){
  const row = document.createElement('div');
  row.className = 'area-row';
  row.innerHTML = `
    <div class="area-row-top">
      <span class="area-row-label">${label}</span>
      <span class="area-row-pct">${Math.round(stats.pct2*100)}% dominado · ${stats.total} lesões</span>
    </div>
    <div class="area-row-bar">
      <div class="area-row-seg" style="width:${stats.pct2*100}%;background:${REVIEW_COLORS[2]};"></div>
      <div class="area-row-seg" style="width:${stats.pct1*100}%;background:${REVIEW_COLORS[1]};"></div>
      <div class="area-row-seg" style="width:${stats.pct0*100}%;background:${REVIEW_COLORS[0]};"></div>
    </div>`;
  if(onStart){
    const btn = document.createElement('button');
    btn.className = 'area-row-quiz-btn';
    btn.textContent = '🧠 praticar esta área';
    btn.onclick = onStart;
    row.appendChild(btn);
  }
  return row;
}

function openProgressDashboard(){
  const areaStats = computeAreaStats();
  const totalAll = DATA.length || 1;
  const c0 = DATA.filter(e=>getReview(e.id)===0).length;
  const c1 = DATA.filter(e=>getReview(e.id)===1).length;
  const c2 = DATA.filter(e=>getReview(e.id)===2).length;
  const dueToday = countDue(DATA);

  const weakest = areaStats.slice().sort((a,b)=> a.pct2-b.pct2 || b.total-a.total).slice(0,8);
  const strongest = areaStats.slice().filter(a=>a.pct2>0).sort((a,b)=> b.pct2-a.pct2 || b.total-a.total).slice(0,5);

  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.onclick = (ev)=>{ if(ev.target===ov) closeOverlay(); };
  ov.innerHTML = `
    <div class="modal progress-modal">
      <h2>📊 Painel de Progresso</h2>
      <div class="progress-summary-grid">
        <div class="progress-stat-card"><div class="n">${totalAll}</div><div class="l">lesões</div></div>
        <div class="progress-stat-card"><div class="n" style="color:${REVIEW_COLORS[2]}">${Math.round(c2/totalAll*100)}%</div><div class="l">dominado</div></div>
        <div class="progress-stat-card"><div class="n" style="color:${REVIEW_COLORS[1]}">${Math.round(c1/totalAll*100)}%</div><div class="l">revisando</div></div>
        <div class="progress-stat-card"><div class="n" style="color:${REVIEW_COLORS[0]}">${Math.round(c0/totalAll*100)}%</div><div class="l">não revisado</div></div>
        <div class="progress-stat-card"><div class="n" style="color:#E8935B">${dueToday}</div><div class="l">pendentes hoje</div></div>
      </div>

      <div class="progress-section-label">📅 ATIVIDADE (ÚLTIMOS 14 DIAS)</div>
      <div class="activity-strip" id="activity-strip"></div>

      <div class="progress-section-label">🔻 PRECISA DE MAIS ATENÇÃO</div>
      <div id="weak-areas" class="area-list"></div>

      <div class="progress-section-label">🔺 INDO BEM</div>
      <div id="strong-areas" class="area-list"></div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="progress-close">fechar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const stripEl = document.getElementById('activity-strip');
  const today = new Date();
  let maxReviewed = 1;
  const days = [];
  for(let i=13;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = todayKey(d);
    const rec = SESSIONLOG[key];
    const n = rec ? rec.reviewed : 0;
    maxReviewed = Math.max(maxReviewed, n);
    days.push({key, n, label: d.getDate()});
  }
  days.forEach(d=>{
    const sq = document.createElement('div');
    sq.className = 'activity-square';
    sq.style.background = REVIEW_COLORS[2];
    sq.style.opacity = d.n===0 ? 0.12 : (0.35 + (d.n/maxReviewed)*0.65);
    sq.title = `${d.key}: ${d.n} lesões revisadas`;
    stripEl.appendChild(sq);
  });

  const weakEl = document.getElementById('weak-areas');
  if(weakest.length===0){
    weakEl.innerHTML = '<div class="area-list-empty">Sem dados suficientes ainda.</div>';
  } else {
    weakest.forEach(a=>{
      weakEl.appendChild(buildAreaRow(`${a.site} <span style="color:var(--muted-2)">· ${a.section}</span>`, a, ()=>{
        closeOverlay();
        const items = DATA.filter(e=>e.s===a.section && e.site===a.site);
        startQuizSession(shuffleArr(items).slice(0,30));
      }));
    });
  }

  const strongEl = document.getElementById('strong-areas');
  if(strongest.length===0){
    strongEl.innerHTML = '<div class="area-list-empty">Ainda não há áreas dominadas — comece uma sessão de quiz!</div>';
  } else {
    strongest.forEach(a=>{
      strongEl.appendChild(buildAreaRow(`${a.site} <span style="color:var(--muted-2)">· ${a.section}</span>`, a, null));
    });
  }

  document.getElementById('progress-close').onclick = closeOverlay;
}

document.getElementById('progress-btn').onclick = openProgressDashboard;
document.getElementById('quiz-btn').onclick = openQuizSetup;

loadData();
</script>
</body>
</html>
