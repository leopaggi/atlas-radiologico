<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Atlas de Padrões — Radiologia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --ink:#0E1720;
  --panel:#16212C;
  --panel-2:#1B2833;
  --line:#263644;
  --text:#E7EEF2;
  --muted:#8CA0AC;
  --muted-2:#5C7382;
  --teal:#5FC7D4;
  --teal-dim:#2E4A50;
  --amber:#E8935B;
  --amber-dim:#4A362A;
  --red:#D9756B;
  --tag-bg:#1D2B35;
  --tag-bg-active:#20414A;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  line-height:1.5;
  overflow:hidden;
}
#app{display:flex;height:100vh;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:270px;
  min-width:270px;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
#brand{
  padding:20px 18px 14px 18px;
  border-bottom:1px solid var(--line);
}
#brand .mark{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.06em;
  color:var(--teal);
}
#brand h1{
  font-family:'IBM Plex Serif',serif;
  font-weight:600;
  font-size:19px;
  margin:4px 0 2px 0;
  color:var(--text);
}
#brand .sub{color:var(--muted);font-size:12px;}
#tree{flex:1;overflow-y:auto;padding:10px 8px 10px 8px;}
.tree-section{margin-bottom:2px;}
.tree-section-head{
  display:flex;align-items:center;gap:6px;
  padding:8px 10px;border-radius:var(--radius);
  cursor:pointer;user-select:none;
  color:var(--text);font-weight:500;
}
.tree-section-head:hover{background:var(--panel-2);}
.tree-section-head.active-scope{background:var(--teal-dim);color:var(--teal);}
.tree-section-head .chev{
  width:10px;color:var(--muted-2);font-size:10px;transition:transform .15s ease;
}
.tree-section-head.open .chev{transform:rotate(90deg);}
.tree-section-head .count{
  margin-left:auto;color:var(--muted-2);font-size:11px;font-family:'IBM Plex Mono',monospace;
}
.tree-section-head .reorder-btns{
  margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .1s ease;
}
.tree-section-head:hover .reorder-btns{opacity:1;}
.tree-section-head .count{margin-left:6px;}
.reorder-btn{
  background:none;border:none;color:var(--muted-2);font-size:9px;cursor:pointer;padding:2px 3px;line-height:1;
}
.reorder-btn:hover{color:var(--teal);}
.reorder-btn:disabled{opacity:.25;cursor:default;}
.reorder-btn:disabled:hover{color:var(--muted-2);}
.tree-sites{padding-left:24px;display:none;}
.tree-sites.open{display:block;}
.tree-site{
  padding:6px 10px;border-radius:var(--radius);cursor:pointer;color:var(--muted);
  font-size:13px;display:flex;
}
.tree-site:hover{background:var(--panel-2);color:var(--text);}
.tree-site.active-scope{background:var(--teal-dim);color:var(--teal);}
.tree-site .count{margin-left:auto;color:var(--muted-2);font-size:11px;font-family:'IBM Plex Mono',monospace;}

#sidebar-foot{
  border-top:1px solid var(--line);
  padding:10px 14px;
  display:flex;flex-direction:column;gap:6px;
}
.foot-btn{
  background:none;border:none;color:var(--muted);font-size:12px;text-align:left;
  cursor:pointer;padding:4px 0;font-family:inherit;
}
.foot-btn:hover{color:var(--teal);}

/* ---------- Main ---------- */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#header{
  padding:18px 28px 14px 28px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;
}
#scope-title{
  font-family:'IBM Plex Serif',serif;font-size:20px;font-weight:600;flex-shrink:0;
}
#scope-title .path{color:var(--muted-2);font-weight:500;font-size:13px;font-family:'IBM Plex Sans',sans-serif;}
#search-wrap{flex:1;position:relative;max-width:360px;}
#search{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:9px 12px 9px 30px;border-radius:var(--radius);font-family:inherit;font-size:13px;
}
#search:focus{outline:none;border-color:var(--teal);}
#search-wrap::before{
  content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:15px;
}
#progress-btn{
  margin-left:auto;background:none;color:var(--muted);border:1px solid var(--line);padding:9px 14px;
  border-radius:var(--radius);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;
}
#progress-btn:hover{color:var(--text);border-color:var(--muted-2);}
#quiz-btn{
  margin-left:8px;background:none;color:var(--teal);border:1px solid var(--teal-dim);padding:9px 14px;
  border-radius:var(--radius);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  flex-shrink:0;position:relative;
}
#quiz-btn:hover{border-color:var(--teal);background:var(--tag-bg-active);}
.quiz-due-badge{
  position:absolute;top:-6px;right:-6px;background:#E8935B;color:#1a1108;font-size:10px;font-weight:700;
  border-radius:9px;padding:1px 6px;line-height:1.4;
}
#add-btn{
  margin-left:10px;background:var(--amber);color:#1a1108;border:none;padding:9px 16px;
  border-radius:var(--radius);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  flex-shrink:0;
}
#add-btn:hover{filter:brightness(1.08);}

.progress-modal{max-width:600px;max-height:85vh;overflow-y:auto;}
.progress-summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 20px;}
.progress-stat-card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 6px;text-align:center;}
.progress-stat-card .n{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--text);}
.progress-stat-card .l{font-size:10px;color:var(--muted-2);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}
.progress-section-label{font-size:11px;color:var(--muted-2);font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;margin:20px 0 10px;font-weight:600;}
.activity-strip{display:flex;gap:4px;}
.activity-square{flex:1;height:28px;border-radius:3px;}
.area-list{display:flex;flex-direction:column;gap:10px;}
.area-list-empty{font-size:12.5px;color:var(--muted-2);padding:8px 0;}
.area-row{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;}
.area-row-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px;}
.area-row-label{font-size:13px;color:var(--text);font-weight:500;}
.area-row-pct{font-size:11px;color:var(--muted);white-space:nowrap;font-family:'IBM Plex Mono',monospace;}
.area-row-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel);}
.area-row-seg{height:100%;}
.area-row-quiz-btn{
  margin-top:8px;background:none;border:1px solid var(--teal-dim);color:var(--teal);border-radius:6px;
  padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;
}
.area-row-quiz-btn:hover{background:var(--tag-bg-active);border-color:var(--teal);}

.quiz-setup-modal, .quiz-modal{max-width:480px;}
.quiz-setup-row{margin:14px 0;}
.quiz-radio, .quiz-check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);margin-bottom:10px;cursor:pointer;}
.quiz-count-preview{font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-family:'IBM Plex Mono',monospace;}
.quiz-progress{font-size:11.5px;color:var(--muted-2);font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;margin-bottom:14px;text-align:center;}
.quiz-stage{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;}
.quiz-meta-hint{color:var(--muted);font-size:13px;margin-bottom:6px;}
.quiz-img-wrap{width:100%;}
.quiz-img{width:100%;max-height:320px;object-fit:contain;border-radius:var(--radius);background:var(--panel-2);}
.quiz-img-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%;}
.quiz-img-item{background:var(--panel-2);border-radius:var(--radius);overflow:hidden;}
.quiz-img-item img{width:100%;max-height:220px;object-fit:contain;display:block;background:var(--panel-2);cursor:zoom-in;}
.quiz-img-label{font-size:11px;color:var(--muted);text-align:center;padding:4px 2px;font-family:'IBM Plex Mono',monospace;}
.quiz-grade-row{display:flex;gap:10px;margin-top:16px;}
.quiz-grade-row .btn{flex:1;padding:12px;font-weight:700;}
.quiz-grade-wrong{background:#E8935B22;color:#E8935B;border:1px solid #E8935B55;}
.quiz-grade-wrong:hover{background:#E8935B33;}
.quiz-grade-right{background:#4E9A6A22;color:#4E9A6A;border:1px solid #4E9A6A55;}
.quiz-grade-right:hover{background:#4E9A6A33;}
.quiz-add-img-btn{width:100%;margin-top:12px;font-size:12.5px;}
.quiz-summary-stats{display:flex;justify-content:center;gap:36px;margin:22px 0;}
.quiz-stat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);}
.quiz-stat .n{font-size:28px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.hover-img-preview{
  position:fixed;z-index:999;pointer-events:none;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.hover-img-preview img{display:block;max-width:280px;max-height:280px;border-radius:2px;object-fit:contain;}
.card-thumb.has-preview{cursor:zoom-in;}
.quiz-radiopaedia-link{margin-top:14px;}

#tagbar{
  padding:12px 28px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:120px;overflow-y:auto;
}
#tagbar .tagbar-label{color:var(--muted-2);font-size:11px;font-family:'IBM Plex Mono',monospace;margin-right:4px;letter-spacing:.04em;}
.tag-chip{
  background:var(--tag-bg);border:1px solid var(--line);color:var(--muted);
  padding:5px 10px;border-radius:12px;font-size:12px;cursor:pointer;user-select:none;
  white-space:nowrap;
}
.tag-chip:hover{border-color:var(--teal-dim);color:var(--text);}
.tag-chip.active{background:var(--tag-bg-active);border-color:var(--teal);color:var(--teal);}
.tag-chip .n{color:var(--muted-2);font-size:10px;margin-left:4px;}
.tag-chip.active .n{color:var(--teal);opacity:.7;}
#clear-tags{
  color:var(--red);font-size:12px;cursor:pointer;margin-left:6px;background:none;border:none;font-family:inherit;
}

#reviewbar{
  padding:10px 28px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;
}
.progress-track{
  flex:1;min-width:140px;max-width:280px;height:6px;border-radius:3px;background:var(--panel-2);
  overflow:hidden;display:flex;
}
.progress-seg{height:100%;}
.review-chip{
  border:1px solid var(--line);background:var(--tag-bg);color:var(--muted);
  padding:5px 11px;border-radius:12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.review-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.review-chip.active{border-color:var(--teal);color:var(--text);background:var(--tag-bg-active);}
.review-chip .n{color:var(--muted-2);font-size:10.5px;}

#results{flex:1;overflow-y:auto;padding:18px 28px 40px 28px;}
#result-count{color:var(--muted-2);font-size:12px;font-family:'IBM Plex Mono',monospace;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;display:flex;gap:12px;
}
.card:hover{border-color:var(--teal-dim);}
.card-thumb{
  width:56px;height:56px;flex-shrink:0;border-radius:var(--radius);background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;color:var(--muted-2);font-size:10px;
  background-size:cover;background-position:center;text-align:center;overflow:hidden;position:relative;
}
.thumb-count-badge{
  position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,.75);color:#fff;font-size:9px;
  font-weight:700;padding:1px 4px;border-radius:6px;line-height:1.4;
}
.card-body{flex:1;min-width:0;}
.card-title{font-weight:600;font-size:14.5px;color:var(--text);margin-bottom:2px;}
.card-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
.card-title-row .card-title{margin-bottom:0;}
.inc-badge{
  font-size:10px;font-weight:600;padding:2px 8px;border-radius:9px;border:1px solid;
  white-space:nowrap;flex-shrink:0;
}
.card-site{color:var(--muted-2);font-size:11.5px;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;}
.mini-tag{background:var(--tag-bg);color:var(--muted);font-size:10.5px;padding:2px 7px;border-radius:9px;}
.mini-tag.match{background:var(--tag-bg-active);color:var(--teal);}
.card-linkrow{margin-top:8px;color:var(--teal);opacity:.75;font-size:11px;}
.card-classrow{margin-top:6px;color:var(--amber);opacity:.9;font-size:11px;}
.card-review-btn{
  background:none;border:1px solid;border-radius:10px;font-size:11px;padding:3px 9px;
  cursor:pointer;margin:2px 0 8px 0;font-family:inherit;
}
.card-review-btn:hover{filter:brightness(1.2);}
#empty-state{color:var(--muted-2);text-align:center;padding:60px 20px;font-size:13.5px;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(6,10,14,.7);display:flex;align-items:flex-start;justify-content:center;
  padding:5vh 20px;overflow-y:auto;z-index:50;
}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:4px;width:100%;max-width:560px;
  padding:26px 26px 22px 26px;
}
.modal h2{font-family:'IBM Plex Serif',serif;font-size:19px;margin:0 0 4px 0;}
.detail-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.detail-title-row h2{flex:1;}
.detail-title-row .inc-badge{margin-top:3px;}
.modal .modal-sub{color:var(--muted-2);font-size:12px;font-family:'IBM Plex Mono',monospace;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;letter-spacing:.02em;}
.field input,.field select,.field textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  padding:9px 10px;border-radius:var(--radius);font-family:inherit;font-size:13.5px;
}
.field textarea{resize:vertical;min-height:56px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.chip-input-wrap{
  display:flex;flex-wrap:wrap;gap:6px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px;min-height:42px;
}
.chip-input-wrap input{border:none;background:none;flex:1;min-width:110px;padding:2px;}
.chip-input-wrap input:focus{outline:none;}
.removable-tag{
  background:var(--tag-bg-active);color:var(--teal);font-size:12px;padding:4px 8px 4px 10px;border-radius:11px;
  display:flex;align-items:center;gap:6px;
}
.removable-tag button{background:none;border:none;color:var(--teal);cursor:pointer;font-size:13px;padding:0;line-height:1;}
.link-row{
  display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:7px 10px;margin-bottom:6px;font-size:12.5px;
}
.link-row-label{color:var(--teal);flex-shrink:0;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-row-url{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-row-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;flex-shrink:0;}
.suggest-row{margin-top:10px;max-height:220px;overflow-y:auto;padding-right:4px;}
.img-upload-box{
  border:1.5px dashed var(--line);border-radius:var(--radius);padding:14px;
  background:var(--panel-2);outline:none;text-align:center;
}
.img-upload-box:focus{border-color:var(--teal);}
.img-cloud-status{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45;}
.img-cloud-status.ok{color:var(--teal);}
.img-cloud-status.warn{color:var(--amber);}
.img-source-badge{position:absolute;top:4px;left:4px;background:rgba(14,23,32,.82);color:var(--teal);font-size:9px;padding:1px 5px;border-radius:7px;font-family:'IBM Plex Mono',monospace;}
.img-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:8px;}
.img-gallery:empty{display:none;}
.img-gallery-item{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:6px;position:relative;}
.img-gallery-item img{width:100%;height:80px;object-fit:cover;border-radius:4px;display:block;margin-bottom:6px;}
.img-gallery-label{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:11px;padding:4px 6px;border-radius:4px;font-family:inherit;margin-bottom:6px;
}
.img-gallery-presets{display:flex;flex-wrap:wrap;gap:4px;}
.img-gallery-modality{margin:5px 0 6px;padding-top:5px;border-top:1px solid var(--line);}
.img-gallery-modality-title{font-size:9px;color:var(--muted-2);font-family:'IBM Plex Mono',monospace;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
.img-gallery-preset-chip{
  background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:10px;
  padding:3px 7px;border-radius:10px;cursor:pointer;font-family:inherit;
}
.img-gallery-preset-chip:hover{color:var(--text);border-color:var(--muted-2);}
.img-gallery-preset-chip.active{background:var(--tag-bg-active);border-color:var(--teal);color:var(--teal);}
.img-gallery-remove{
  position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;
  width:18px;height:18px;border-radius:50%;font-size:11px;cursor:pointer;line-height:1;
}
.img-gallery-remove:hover{background:#c0392b;}
.suggest-group-label{font-size:10px;color:var(--muted-2);letter-spacing:.05em;margin:10px 0 5px 0;font-family:'IBM Plex Mono',monospace;}
.suggest-group-label:first-child{margin-top:0;}
.suggest-row-inner{display:flex;flex-wrap:wrap;gap:5px;}
.suggest-chip{
  background:var(--panel-2);border:1px dashed var(--line);color:var(--muted-2);font-size:11px;
  padding:3px 8px;border-radius:10px;cursor:pointer;
}
.suggest-chip:hover{color:var(--teal);border-color:var(--teal-dim);}
.modal-actions{display:flex;justify-content:space-between;margin-top:20px;gap:10px;}
.btn{
  border:none;border-radius:var(--radius);padding:9px 16px;font-family:inherit;font-size:13px;
  font-weight:600;cursor:pointer;
}
.btn-primary{background:var(--amber);color:#1a1108;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--line);}
.btn-ghost:hover{color:var(--text);border-color:var(--muted-2);}
.btn-danger{background:none;color:var(--red);border:1px solid var(--amber-dim);}
.btn-danger:hover{background:rgba(217,117,107,.1);}

/* detail modal specifics */
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0;}
.detail-img{width:100%;max-height:260px;object-fit:cover;border-radius:var(--radius);margin-bottom:14px;background:var(--panel-2);}
.detail-img-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px;}
.detail-img-item{background:var(--panel-2);border-radius:var(--radius);overflow:hidden;}
.detail-img-item img{width:100%;height:110px;object-fit:cover;display:block;cursor:zoom-in;}
.lightbox-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;
  z-index:9999;padding:24px;cursor:zoom-out;
}

<script>
/* ============================================================
   FIREBASE — sincronização entre dispositivos (Firestore)
   Tudo (lesões, revisão, quiz, ordem de seções) espelha um único
   documento no Firestore. O armazenamento local continua funcionando
   como cache/offline; o Firestore é a fonte de verdade quando disponível.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCGGpDCeOmTLTN6nt4qvyo41vnRgea2hvE",
  authDomain: "atlas-radiologico.firebaseapp.com",
  projectId: "atlas-radiologico",
  storageBucket: "atlas-radiologico.firebasestorage.app",
  messagingSenderId: "967666937084",
  appId: "1:967666937084:web:39562a53ff559dd408fb79"
};
let fbDb = null;
try{
  const fbApp = firebase.initializeApp(firebaseConfig);
  fbDb = firebase.firestore(fbApp);
}catch(e){ console.error('Firebase init falhou — app continua funcionando localmente.', e); }

const FB_DOC_REF = () => fbDb.collection('atlas_state').doc('main');
let fbSyncing = false;   // evita brigar com o próprio load inicial
let fbPushTimer = null;

/* envia o estado atual pra nuvem (com pequeno atraso pra juntar mudanças rápidas em uma escrita só) */
function pushToFirebase(){
  if(!fbDb || fbSyncing) return;
  clearTimeout(fbPushTimer);
  fbPushTimer = setTimeout(async ()=>{
    try{
      await FB_DOC_REF().set({
        data: DATA,
        review: REVIEW,
        srs: SRS,
        sessionLog: SESSIONLOG,
        sectionOrder: sectionOrder,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(e){ console.error('Firebase push falhou (ficou salvo só localmente por enquanto).', e); }
  }, 400);
}

/* busca o estado da nuvem e reconcilia com o local; some lesões canônicas novas (de atualizações do app) que a nuvem ainda não tem */
async function syncFromFirebase(){
  if(!fbDb) return;
  fbSyncing = true;
  try{
    const snap = await FB_DOC_REF().get();
    if(snap.exists){
      const remote = snap.data() || {};
      const remoteData = Array.isArray(remote.data) ? remote.data : [];
      const remoteIds = new Set(remoteData.map(e=>e.id));
      const newCanonical = DATA.filter(e => isSeedLikeId(e.id) && !remoteIds.has(e.id));
      DATA = [...remoteData, ...newCanonical];
      REVIEW = remote.review || {};
      SRS = remote.srs || {};
      SESSIONLOG = remote.sessionLog || {};
      if(Array.isArray(remote.sectionOrder) && remote.sectionOrder.length) sectionOrder = remote.sectionOrder;
      await saveData();
      await saveOrder();
      try{ await storage.set(REVIEW_KEY, JSON.stringify(REVIEW), false); }catch(e){}
      await saveSRS();
      await saveSessionLog();
      fbSyncing = false;
      if(newCanonical.length) pushToFirebase();
    } else {
      fbSyncing = false;
      pushToFirebase(); // primeira vez: sobe o estado local atual pra nuvem
    }
  }catch(e){
    fbSyncing = false;
    console.error('Firebase sync falhou — usando dados locais por enquanto.', e);
  }
}

/* ============================================================
   CAMADA DE ARMAZENAMENTO — funciona dentro do Claude (window.storage)
   E também como arquivo local/offline aberto direto no navegador (localStorage).
   Todo o resto do app usa apenas `storage.get/set/delete`, nunca window.storage direto.
   ============================================================ */
const LOCAL_PREFIX = 'atlas_radiologico_offline:';
function hasNativeStorage(){
  return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
const usingOfflineStorage = !hasNativeStorage();
const storage = hasNativeStorage() ? window.storage : {
  async get(key, shared){
    const raw = localStorage.getItem(LOCAL_PREFIX+key);
    if(raw === null){ throw new Error('key not found: '+key); }
    return { key, value: raw, shared: !!shared };
  },
  async set(key, value, shared){
    localStorage.setItem(LOCAL_PREFIX+key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    localStorage.removeItem(LOCAL_PREFIX+key);
    return { key, deleted:true, shared: !!shared };
  },
  async list(prefix, shared){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(LOCAL_PREFIX)===0){
        const bare = k.slice(LOCAL_PREFIX.length);
        if(!prefix || bare.indexOf(prefix)===0) keys.push(bare);
      }
    }
    return { keys, prefix, shared: !!shared };
  }
 };

/* ============================================================
   CLOUDINARY — configuração fica somente no navegador local; nunca entra no HTML nem no backup.
   Usa upload unsigned direto do navegador. O Atlas guarda apenas URLs/metadados leves.
   ============================================================ */
const CLOUDINARY_CONFIG_LOCAL = LOCAL_PREFIX+'cloudinary_config';
function getCloudinaryConfig(){
  try{
    const raw=localStorage.getItem(CLOUDINARY_CONFIG_LOCAL);
    if(!raw) return {cloudName:'', uploadPreset:'', folder:''};
    const c=JSON.parse(raw);
    return {cloudName:(c.cloudName||'').trim(), uploadPreset:(c.uploadPreset||'').trim(), folder:(c.folder||'').trim()};
  }catch(e){ return {cloudName:'', uploadPreset:'', folder:''}; }
}
function setCloudinaryConfig(c){
  try{
    const clean={cloudName:(c.cloudName||'').trim(), uploadPreset:(c.uploadPreset||'').trim(), folder:(c.folder||'').trim()};
    if(!clean.cloudName || !clean.uploadPreset) localStorage.removeItem(CLOUDINARY_CONFIG_LOCAL);
    else localStorage.setItem(CLOUDINARY_CONFIG_LOCAL, JSON.stringify(clean));
    return true;
  }catch(e){ return false; }
}
function hasCloudinaryConfig(){ const c=getCloudinaryConfig(); return !!(c.cloudName && c.uploadPreset); }
function escAttr(v){ return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
async function uploadToCloudinary(file){
  const cfg=getCloudinaryConfig();
  if(!cfg.cloudName || !cfg.uploadPreset) throw new Error('Configure o Cloudinary primeiro.');
  if(!file || !file.type || !file.type.startsWith('image/')) throw new Error('Arquivo de imagem inválido.');
  const fd=new FormData();
  fd.append('file',file,file.name||('atlas-'+Date.now()+'.png'));
  fd.append('upload_preset',cfg.uploadPreset);
  if(cfg.folder) fd.append('folder',cfg.folder);
  fd.append('tags','atlas-radiologico');
  const endpoint='https://api.cloudinary.com/v1_1/'+encodeURIComponent(cfg.cloudName)+'/image/upload';
  const res=await fetch(endpoint,{method:'POST',body:fd});
  let out=null; try{ out=await res.json(); }catch(e){}
  if(!res.ok || !out || !out.secure_url){
    const msg=(out&&out.error&&out.error.message) || ('HTTP '+res.status);
    throw new Error(String(msg));
  }
  return {
    label:'', data:out.secure_url, source:'cloudinary',
    thumb:out.secure_url, publicId:out.public_id||'', assetId:out.asset_id||'',
    width:out.width||'', height:out.height||'', format:out.format||'', bytes:out.bytes||''
  };
}
function openCloudinarySettings(){
  const cfg=getCloudinaryConfig();
  const ov=document.createElement('div'); ov.className='overlay';
  ov.onclick=(ev)=>{ if(ev.target===ov) closeOverlay(); };
  ov.innerHTML=`<div class="modal" style="max-width:560px;">
    <h2>☁ Cloudinary</h2>
    <div class="modal-sub">upload externo de imagens do Atlas</div>
    <div class="field"><label>Cloud name</label><input id="cloudinary-cloud" autocomplete="off" value="${escAttr(cfg.cloudName)}" placeholder="ex: dxxxxxxx"></div>
    <div class="field"><label>Unsigned upload preset</label><input id="cloudinary-preset" autocomplete="off" value="${escAttr(cfg.uploadPreset)}" placeholder="ex: atlas_radiologico"></div>
    <div class="field"><label>Pasta no Cloudinary (opcional)</label><input id="cloudinary-folder" autocomplete="off" value="${escAttr(cfg.folder)}" placeholder="ex: atlas-radiologico"></div>
    <div class="detail-notes">O Atlas usa upload <b>unsigned</b>: não precisa de API Secret e nenhuma senha fica no HTML. Estes dados ficam somente no localStorage deste navegador e não entram no backup JSON. No Cloudinary, crie um Upload Preset marcado como <b>Unsigned</b>. Para reduzir abuso, restrinja formatos/tamanho no próprio preset. Não envie imagens com nome, prontuário ou qualquer outro dado identificável do paciente.</div>
    <div class="modal-actions"><button class="btn btn-ghost" id="cloudinary-cancel">cancelar</button><div style="display:flex;gap:8px"><button class="btn btn-danger" id="cloudinary-clear">remover configuração</button><button class="btn btn-primary" id="cloudinary-save">salvar</button></div></div>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('cloudinary-cancel').onclick=closeOverlay;
  document.getElementById('cloudinary-clear').onclick=()=>{ setCloudinaryConfig({}); closeOverlay(); toast('Configuração do Cloudinary removida deste navegador.'); };
  document.getElementById('cloudinary-save').onclick=()=>{
    const cloudName=document.getElementById('cloudinary-cloud').value.trim();
    const uploadPreset=document.getElementById('cloudinary-preset').value.trim();
    const folder=document.getElementById('cloudinary-folder').value.trim();
    if(!cloudName || !uploadPreset){ toast('Preencha Cloud name e unsigned upload preset.'); return; }
    setCloudinaryConfig({cloudName,uploadPreset,folder}); closeOverlay();
    toast('Cloudinary configurado. Próximas imagens serão enviadas para a nuvem.');
  };
}

    `<div class="class-row"><span class="class-code">${c.code}</span><div class="class-body"><span class="class-label">${c.label}</span><span class="class-desc">${c.desc}</span></div></div>`

/* níveis de incidência relativa (dentro do próprio sítio), usados para ordenar
   a lista das lesões mais comuns para as mais raras. Classificação qualitativa
   de apoio ao estudo, não estatística epidemiológica formal. */
const INC_LABELS = {1:"Muito comum",2:"Comum",3:"Incomum",4:"Raro"};
const INC_COLORS = {1:"#4E9A6A",2:"#5FC7D4",3:"#E8935B",4:"#D9756B"};
function incLabel(n){ return INC_LABELS[n] || INC_LABELS[2]; }
function incColor(n){ return INC_COLORS[n] || INC_COLORS[2]; }

      {code:"3", label:"Provavelmente benigno", desc:"Massa oval/redonda, circunscrita, sem microcalcificações associadas (ex: fibroadenoma sólido não calcificado, cisto complicado); espera-se estabilidade no seguimento de 6 meses."},

/* controle pessoal de revisão — separado dos dados da lesão, guardado por id.
   0 = não revisado · 1 = revisando · 2 = dominado */
const REVIEW_KEY = 'atlas:review';
const REVIEW_LABELS = {0:"Não revisado",1:"Revisando",2:"Dominado"};
const REVIEW_COLORS = {0:"#5C7382",1:"#E8935B",2:"#4E9A6A"};
const REVIEW_ICONS = {0:"○",1:"◐",2:"●"};
let REVIEW = {};

/* ============================================================
   REPETIÇÃO ESPAÇADA (para o Modo Quiz) — estilo Leitner simples
   ============================================================ */
const SRS_KEY = 'atlas:srs';
let SRS = {}; // { [id]: {interval:number(dias), due:number(timestamp ms), streak:number} }
async function loadSRS(){
  try{ const r = await storage.get(SRS_KEY, false); SRS = JSON.parse(r.value); }
  catch(e){ SRS = {}; }
}
async function saveSRS(){
  try{ await storage.set(SRS_KEY, JSON.stringify(SRS), false); }catch(e){}
  pushToFirebase();
}
function isDue(id){
  const s = SRS[id];
  if(!s) return true; // nunca estudada = sempre pendente
  return s.due <= Date.now();
}
function srsGrade(id, correct){
  const s = SRS[id] || {interval:0, due:0, streak:0};
  const steps = [1,3,7,14,30,60,120];
  if(correct){
    s.streak = (s.streak||0) + 1;
    s.interval = steps[Math.min(s.streak-1, steps.length-1)];
    setReview(id, s.interval>=30 ? 2 : 1);
  } else {
    s.streak = 0;
    s.interval = 1;
    setReview(id, 1);
  }
  s.due = Date.now() + s.interval*24*60*60*1000;
  SRS[id] = s;
  saveSRS();
}
function countDue(entries){
  return entries.filter(e=>isDue(e.id)).length;
}

/* histórico de sessões de estudo, pro painel de progresso */
const SESSIONLOG_KEY = 'atlas:sessionlog';
let SESSIONLOG = {}; // { 'YYYY-MM-DD': {reviewed:N, right:N, wrong:N} }
async function loadSessionLog(){
  try{ const r = await storage.get(SESSIONLOG_KEY, false); SESSIONLOG = JSON.parse(r.value); }
  catch(e){ SESSIONLOG = {}; }
}
async function saveSessionLog(){
  try{ await storage.set(SESSIONLOG_KEY, JSON.stringify(SESSIONLOG), false); }catch(e){}
  pushToFirebase();
}
function todayKey(d){
  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function logSessionResult(right, wrong){
  if(right+wrong===0) return;
  const key = todayKey();
  const cur = SESSIONLOG[key] || {reviewed:0,right:0,wrong:0};
  cur.reviewed += (right+wrong);
  cur.right += right;
  cur.wrong += wrong;
  SESSIONLOG[key] = cur;
  saveSessionLog();
}
function getReview(id){ return REVIEW[id] || 0; }
function setReview(id, status){ REVIEW[id] = status; saveReview(); }
function cycleReview(id){ setReview(id, (getReview(id)+1)%3); }
async function saveReview(){
  try{ await storage.set(REVIEW_KEY, JSON.stringify(REVIEW), false); }
  catch(e){ console.error('storage error', e); }
  pushToFirebase();
}

io","tags":["difuso","aumento de volume"],"inc":2,"notes":"Aumento excessivo do volume de líquido amniótico; associação com diabetes materno, anomalias do trato gastrointestinal fetal (atresias) ou anormalidades do SNC.","id":"seed_930","img":"","enTerm":"polyhydramnios","links":[{"label":"Radiopaedia — buscar casos","url":"https://radiopaedia.org/search?lang=us&q=polyhydramnios"}]},{"s":"Obstetrícia","site":"Placenta e anexos ovulares","name":"Corioamnionite","tags":["heterogêneo","edema"],"inc":2,"notes":"Infecção das membranas ovulares e do líquido amniótico; espessamento e ecogenicidade heterogênea da placenta e membranas, com sedimento em suspensão no líquido amniótico ('sludge').","id":"seed_931","img":"","enTerm":"chorioamnionitis","links":[{"label":"Radiopaedia — buscar casos","url":"https://radiopaedia.org/search?lang=us&q=chorioamnionitis"}]},{"s":"Obstetrícia","site":"Placenta e anexos ovulares","name":"Trombose do seio marginal placentário","tags":["hipoecogênico","bem circunscrita"],"inc":3,"notes":"Coleção hipoecogênica na margem placentária por trombose venosa; geralmente achado benigno sem repercussão significativa.","id":"seed_932","img":"","enTerm":"placental marginal sinus thrombosis","links":[{"label":"Radiopaedia — buscar casos","url":"https://radiopaedia.org/search?lang=us&q=placental%20marginal%20sinus%20thrombosis"}]},{"s":"Obstetrícia","site":"Anomalias fetais estruturais","name":"Anencefalia","tags":["margens irregulares"],"inc":4,"notes":"Ausência da calota craniana e do encéfalo acima da órbita, com aspecto característico em 'olhos de sapo'; incompatível com a vida, diagnosticável já no primeiro trimestre.","id":"seed_933","img":"","enTerm":"anencephaly","links":[{"label":"Radiopaedia — buscar casos","url":"https://radiopaedia.org/search?lang=us&q=anencephaly"}]},{"s":"Obstetrícia","site":"Anomalias fetais estruturais","name":"Mielomeningocele (espinha bífida aberta)","tags":["margens irregulares"],"inc":3,"notes":"Defeito de fechamento d /* limpeza única: tags que eram na verdade descrições relacionais específicas de um sítio
   (ex: "destrói o disco"), não classificadores reutilizáveis — o conteúdo já está nas notas. */
const TAG_CLEANUP = [
  {name:"Adenoma hipofisário (macroadenoma)", remove:"epicentro intrasselar"},
  {name:"Metástase óssea vertebral", remove:"poupa o disco"},
  {name:"Espondilodiscite infecciosa", remove:"destrói o disco"},
  {name:"Bócio mergulhante", remove:"contínuo com a tireoide"},
  {name:"IPMN (neoplasia mucinosa papilar intraductal)", remove:"comunica com o ducto"},
  {name:"Carcinoma de endométrio", remove:"invade miométrio"},
  {name:"Ectasia tubular da rede testis", remove:"adjacente ao mediastino testicular"},
  {name:"Cisto sinovial / gânglio", remove:"adjacente à articulação"},
  {name:"Meduloblastoma", remove:"linha média cerebelar"},
  {name:"Apendicite aguda", remove:"edema periapendicular", add:"densificação da gordura"}
];
function runTagCleanup(){
  let changed = false;
  TAG_CLEANUP.forEach(rule=>{
    const e = DATA.find(x=>x.name===rule.name);
    if(!e || !Array.isArray(e.tags)) return;
    if(e.tags.includes(rule.remove)){
      e.tags = e.tags.filter(t=>t!==rule.remove);
      if(rule.add && !e.tags.includes(rule.add)) e.tags.push(rule.add);
      changed = true;
    }
  });
  return changed;
}

/* garante compatibilidade com entradas antigas sem `inc` — recupera pelo id original
   quando é uma lesão de fábrica (evita ambiguidade com nomes repetidos em sítios diferentes) */
function ensureInc(e){
  if(typeof e.inc !== 'number'){
    if(e.id && e.id.indexOf('seed_')===0){
      const idx = parseInt(e.id.slice(5),10);
      if(SEED[idx] && typeof SEED[idx].inc === 'number'){ e.inc = SEED[idx].inc; return e.inc; }
    }
    e.inc = 2;
  }
  return e.inc;
}

/* imagens locais coladas/enviadas pelo usuário — guardadas uma por chave (não dentro do
   blob principal de dados) para não estourar o limite de tamanho por chave de storage */
function imgKey(id){ return 'atlas:img:'+id; }
/* retorna array [{label, data}]; migra automaticamente o formato antigo (uma única dataURL crua) */
async function getLocalImgs(id){
  try{
    const r = await storage.get(imgKey(id), false);
    let parsed = null;
    try{ parsed = JSON.parse(r.value); }catch(e){ parsed = null; }
    if(Array.isArray(parsed)) return parsed;
    if(typeof r.value === 'string' && r.value.indexOf('data:') === 0) return [{label:'', data:r.value}];
    return [];
  }catch(e){ return []; }
}
async function setLocalImgs(id, imgs){
  try{ await storage.set(imgKey(id), JSON.stringify(imgs), false); return true; }
  catch(e){ console.error('storage error', e); return false; }
}
/* compat: primeira imagem apenas, usada em miniatura/preview/quiz quando só precisamos de uma */
async function getLocalImg(id){
  const imgs = await getLocalImgs(id);
  return imgs.length ? imgs[0].data : null;
}
async function deleteLocalImg(id){
  try{ await storage.delete(imgKey(id), false); }catch(e){}
}
/* imagens externas ficam no próprio registro e entram no backup; locais antigos continuam compatíveis */
async function getEntryImgs(e){
  const remote = Array.isArray(e.images) ? e.images.filter(x=>x && x.data).map(x=>({...x, source:x.source||'url'})) : [];
  const local = e.localImg ? await getLocalImgs(e.id) : [];
  return [...remote, ...local.map(x=>({...x, source:x.source||'local'}))];
}
async function getEntryFirstImg(e){ const imgs=await getEntryImgs(e); return imgs.length?imgs[0].data:(e.img||null); }
function hasEntryImgs(e){ return (Array.isArray(e.images)&&e.images.length>0) || !!e.localImg || !!e.img; }
/* redimensiona/comprime antes de salvar, para manter cada imagem leve */
function resizeImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function ensureLinks(e){
  if(!Array.isArray(e.links)){
    const term = EN_TERMS[e.name] || e.name;
    e.links = [{label:"Radiopaedia — buscar casos", url: radiopaediaSearchUrl(term)}];
  }
  return e.links;
}
function isAutoRadiopaediaLink(l){
  return l.label === "Radiopaedia — buscar casos";
}

/* ============================================================
   RECUPERAÇÃO DETERMINÍSTICA — v154
   Base canônica: backup v148 do usuário, 1112 registros.
   Não há merge/deduplicação heurística.
   Se detectar artefatos das migrações v151–v153, restaura exatamente
   a base canônica e preserva somente registros personalizados (não seed_*).
   ============================================================ */
const RECOVERY_KEY = 'atlas:recoveryVersion';
const RECOVERY_VERSION = 'v154-canonical-1112';

function isSeedLikeId(id){
  return /^seed_/.test(String(id||''));
}
function hasBrokenMigrationArtifacts(data){
  if(!Array.isArray(data)) return true;
  return data.length !== 1112 || data.some(e=>/_v(?:151|152|153)(?:_|$)/.test(String((e&&e.id)||'')));
}
async function recoverCanonicalBaseV154(){
  let alreadyRecovered=false;
  try{
    const r=await storage.get(RECOVERY_KEY,false);
    alreadyRecovered = r.value===RECOVERY_VERSION;
  }catch(_e){}
  if(alreadyRecovered) return false;

  if(hasBrokenMigrationArtifacts(DATA)){
    const custom = Array.isArray(DATA) ? DATA.filter(e=>e && !isSeedLikeId(e.id)) : [];
    DATA = JSON.parse(JSON.stringify(SEED));
    const canonicalKeys = new Set(DATA.map(e=>[e.s||'',e.site||'',e.name||''].join('||').toLocaleLowerCase('pt-BR')));
    custom.forEach(e=>{
      const k=[e.s||'',e.site||'',e.name||''].join('||').toLocaleLowerCase('pt-BR');
      if(!canonicalKeys.has(k)) DATA.push(e);
    });
    await saveData();
    console.info(`[Atlas] recuperação v154: base canônica restaurada (${SEED.length}) + ${DATA.length-SEED.length} registro(s) personalizado(s).`);
  }
  try{ await storage.set(RECOVERY_KEY,RECOVERY_VERSION,false); }catch(_e){}
  return true;
}

/* ============================================================
   STORAGE
   ============================================================ */
async function loadData(){
  try{
    const r = await storage.get(STORAGE_KEY, false);
    DATA = JSON.parse(r.value);
    await recoverCanonicalBaseV154();
    let migrated = false;
    DATA.forEach(e=>{
      if(!Array.isArray(e.links)){ ensureLinks(e); migrated = true; }
      else if(e.links.length===1 && isAutoRadiopaediaLink(e.links[0])){
        const term = EN_TERMS[e.name] || e.name;
        const correctUrl = radiopaediaSearchUrl(term);
        if(e.links[0].url !== correctUrl){ e.links[0].url = correctUrl; migrated = true; }
      }
    });
    if(runTagCleanup()) migrated = true;
    DATA.forEach(e=>{ if(typeof e.inc !== 'number'){ ensureInc(e); migrated = true; } });
    if(migrated) await saveData();
  }catch(e){
    DATA = JSON.parse(JSON.stringify(SEED));
    await saveData();
    try{ await storage.set(RECOVERY_KEY,RECOVERY_VERSION,false); }catch(_e){}
  }
  try{
    const r2 = await storage.get(ORDER_KEY, false);
    sectionOrder = JSON.parse(r2.value);
  }catch(e){
    sectionOrder = [...DEFAULT_SECTION_ORDER];
    await saveOrder();
  }
  try{
    const r3 = await storage.get(REVIEW_KEY, false);
    REVIEW = JSON.parse(r3.value);
  }catch(e){ REVIEW = {}; }
  await loadSRS();
  await loadSessionLog();
  await syncFromFirebase();
  renderAll();
}
async function saveData(){
  try{
    await storage.set(STORAGE_KEY, JSON.stringify(DATA), false);
  }catch(e){ console.error('storage error', e); }
  pushToFirebase();
}
async function saveOrder(){
  try{
    await storage.set(ORDER_KEY, JSON.stringify(sectionOrder), false);
  }catch(e){ console.error('storage error', e); }
  pushToFirebase();
}
function orderedSectionNames(map){
  const known = Object.keys(map);
  const ordered = sectionOrder.filter(s=>known.includes(s));
  const extra = known.filter(s=>!sectionOrder.includes(s)).sort();
  const full = [...ordered, ...extra];
  if(extra.length){ sectionOrder = full; saveOrder(); }
  return full;
}
async function moveSection(name, dir){
  const idx = sectionOrder.indexOf(name);
  const swapWith = idx + dir;
  if(idx<0 || swapWith<0 || swapWith>=sectionOrder.length) return;
  [sectionOrder[idx], sectionOrder[swapWith]] = [sectionOrder[swapWith], sectionOrder[idx]];
  await saveOrder();
  renderTree();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   ESTRUTURA / ÁRVORE
   ============================================================ */
function structure(){
  const map = {};
  DATA.forEach(e=>{
    map[e.s] = map[e.s] || {};
    map[e.s][e.site] = (map[e.s][e.site]||0)+1;
  });
  return map;
}
let openSections = new Set();

function renderTree(){
  const map = structure();
  const tree = document.getElementById('tree');
  tree.innerHTML = '';

  // "todas" pseudo-item
  const allDiv = document.createElement('div');
  allDiv.className = 'tree-section-head' + (!scope.section ? ' active-scope' : '');
  allDiv.style.marginBottom = '6px';
  allDiv.innerHTML = `<span>Todas as seções</span><span class="count">${DATA.length}</span>`;
  allDiv.onclick = ()=>{ scope={section:null,site:null}; renderAll(); };
  tree.appendChild(allDiv);

  const orderedNames = orderedSectionNames(map);
  orderedNames.forEach((sectionName, idx)=>{
    const sites = map[sectionName];
    const total = Object.values(sites).reduce((a,b)=>a+b,0);
    const isOpen = openSections.has(sectionName);
    const isActiveScope = scope.section===sectionName && !scope.site;

    const wrap = document.createElement('div');
    wrap.className = 'tree-section';

    const head = document.createElement('div');
    head.className = 'tree-section-head' + (isOpen?' open':'') + (isActiveScope?' active-scope':'');
    head.innerHTML = `<span class="chev">▸</span><span>${sectionName}</span>
      <span class="reorder-btns">
        <button class="reorder-btn" data-dir="-1" title="mover para cima" ${idx===0?'disabled':''}>▲</button>
        <button class="reorder-btn" data-dir="1" title="mover para baixo" ${idx===orderedNames.length-1?'disabled':''}>▼</button>
      </span>
      <span class="count">${total}</span>`;
    head.onclick = (ev)=>{
      if(openSections.has(sectionName)) openSections.delete(sectionName);
      else openSections.add(sectionName);
      scope = {section:sectionName, site:null};
      renderAll();
    };
    head.querySelectorAll('.reorder-btn').forEach(btn=>{
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        if(btn.disabled) return;
        moveSection(sectionName, parseInt(btn.dataset.dir,10));
      };
    });
    wrap.appendChild(head);

    const sitesDiv = document.createElement('div');
    sitesDiv.className = 'tree-sites' + (isOpen?' open':'');
    Object.keys(sites).sort().forEach(siteName=>{
      const sEl = document.createElement('div');
      const active = scope.section===sectionName && scope.site===siteName;
      sEl.className = 'tree-site' + (active?' active-scope':'');
      sEl.innerHTML = `<span>${siteName}</span><span class="count">${sites[siteName]}</span>`;
      sEl.onclick = (ev)=>{ ev.stopPropagation(); scope = {section:sectionName, site:siteName}; renderAll(); };
      sitesDiv.appendChild(sEl);
    });
    wrap.appendChild(sitesDiv);
    tree.appendChild(wrap);
  });
}

/* ============================================================
   FILTRAGEM
   ============================================================ */
function scopedEntries(){
  return DATA.filter(e=>{
    if(scope.section && e.s !== scope.section) return false;
    if(scope.site && e.site !== scope.site) return false;
    return true;
  });
}
function filteredEntries(){
  let list = scopedEntries();
  if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    list = list.filter(e=> e.name.toLowerCase().includes(q) || (e.notes||'').toLowerCase().includes(q) || e.tags.some(t=>t.toLowerCase().includes(q)));
  }
  if(activeTags.size>0){
    list = list.filter(e=> [...activeTags].every(t=> e.tags.includes(t)));
  }
  if(reviewFilter !== null){
    list = list.filter(e=> getReview(e.id) === reviewFilter);
  }
  return list;
}

function renderTagbar(){
  const bar = document.getElementById('tagbar');
  bar.innerHTML = '';
  const label = document.createElement('span');
  label.className = 'tagbar-label';
  label.textContent = 'CARACTERÍSTICAS';
  bar.appendChild(label);

  // conta tags dentro do escopo atual (ignorando os próprios filtros de tag para permitir combinar)
  const base = (()=>{
    let list = scopedEntries();
    if(searchTerm.trim()){
      const q=searchTerm.trim().toLowerCase();
      list = list.filter(e=> e.name.toLowerCase().includes(q) || (e.notes||'').toLowerCase().includes(q) || e.tags.some(t=>t.toLowerCase().includes(q)));
    }
    return list;
  })();

  const counts = {};
  base.forEach(e=> e.tags.forEach(t=> counts[t]=(counts[t]||0)+1 ));
  const tags = Object.keys(counts).sort((a,b)=> counts[b]-counts[a] || a.localeCompare(b));

  if(tags.length===0){
    const none = document.createElement('span');
    none.style.color='var(--muted-2)'; none.style.fontSize='12px';
    none.textContent = 'nenhuma tag neste escopo ainda';
    bar.appendChild(none);
  }

  tags.forEach(t=>{
    const chip = document.createElement('div');
    chip.className = 'tag-chip' + (activeTags.has(t)?' active':'');
    chip.innerHTML = `${t}<span class="n">${counts[t]}</span>`;
    chip.onclick = ()=>{
      if(activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
      renderResults(); renderTagbar();
    };
    bar.appendChild(chip);
  });

  if(activeTags.size>0){
    const clr = document.createElement('button');
    clr.id='clear-tags'; clr.textContent='limpar filtros ✕';
    clr.onclick = ()=>{ activeTags.clear(); renderResults(); renderTagbar(); };
    bar.appendChild(clr);
  }
}

function renderReviewBar(){
  const bar = document.getElementById('reviewbar');
  bar.innerHTML = '';
  const base = scopedEntries();
  const counts = {0:0,1:0,2:0};
  base.forEach(e=> counts[getReview(e.id)]++ );
  const total = base.length || 1;

  const track = document.createElement('div');
  track.className = 'progress-track';
  [0,1,2].forEach(st=>{
    if(counts[st]===0) return;
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    seg.style.width = (counts[st]/total*100)+'%';
    seg.style.background = REVIEW_COLORS[st];
    track.appendChild(seg);
  });
  bar.appendChild(track);

  [null,0,1,2].forEach(st=>{
    const chip = document.createElement('div');
    const isActive = reviewFilter === st;
    chip.className = 'review-chip' + (isActive?' active':'');
    if(st===null){
      chip.innerHTML = `Todas <span class="n">${base.length}</span>`;
    } else {
      chip.innerHTML = `<span class="dot" style="background:${REVIEW_COLORS[st]};"></span>${REVIEW_LABELS[st]} <span class="n">${counts[st]}</span>`;
    }
    chip.onclick = ()=>{ reviewFilter = isActive ? null : st; renderReviewBar(); renderResults(); };
    bar.appendChild(chip);
  });
}

function renderHeader(){
  const path = document.getElementById('scope-path');
  const name = document.getElementById('scope-name');
  if(!scope.section){ path.textContent=''; name.textContent='Todas as seções'; }
  else if(!scope.site){ path.textContent=''; name.textContent=scope.section; }
  else { path.textContent = scope.section + ' / '; name.textContent = scope.site; }
}

function renderResults(){
  const list = filteredEntries();
  document.getElementById('result-count').textContent = `${list.length} lesõe${list.length===1?'':'s'} encontrada${list.length===1?'':'s'}`;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty-state');
  grid.innerHTML = '';
  if(list.length===0){ empty.style.display='block'; return; } else { empty.style.display='none'; }

  list.sort((a,b)=> ((a.inc||2)-(b.inc||2)) || a.name.localeCompare(b.name)).forEach(e=>{
    const card = document.createElement('div');
    card.className = 'card';
    const thumb = document.createElement('div');
    thumb.className = 'card-thumb';
    if(hasEntryImgs(e)){
      thumb.textContent='…';
      getEntryImgs(e).then(imgs=>{
        const all=imgs.length?imgs:(e.img?[{data:e.img}]:[]);
        if(all.length){ thumb.style.backgroundImage=`url(${all[0].data})`; thumb.textContent='';
          if(all.length>1){ const badge=document.createElement('span'); badge.className='thumb-count-badge'; badge.textContent='+'+(all.length-1); thumb.appendChild(badge); }
        }
      });
    } else { thumb.textContent = 'sem\nimagem'; thumb.style.whiteSpace='pre-line'; thumb.style.fontSize='9px'; }
    attachThumbHoverPreview(thumb, e);
    card.appendChild(thumb);

    const body = document.createElement('div');
    body.className = 'card-body';
    const inc = e.inc||2;
    const rv = getReview(e.id);
    body.innerHTML = `<div class="card-title-row"><span class="card-title">${e.name}</span><span class="inc-badge" style="background:${incColor(inc)}22;color:${incColor(inc)};border-color:${incColor(inc)}55;">${incLabel(inc)}</span></div><div class="card-site">${e.s} · ${e.site}</div>`;
    const reviewBtn = document.createElement('button');
    reviewBtn.className = 'card-review-btn';
    reviewBtn.style.color = REVIEW_COLORS[rv];
    reviewBtn.style.borderColor = REVIEW_COLORS[rv]+'66';
    reviewBtn.innerHTML = `${REVIEW_ICONS[rv]} ${REVIEW_LABELS[rv]}`;
    reviewBtn.title = 'clique para mudar o status de revisão';
    reviewBtn.onclick = (ev)=>{
      ev.stopPropagation();
      cycleReview(e.id);
      renderReviewBar();
      renderResults();
    };
    body.appendChild(reviewBtn);
    const tagsDiv = document.createElement('div');
    tagsDiv.className = 'card-tags';
    e.tags.forEach(t=>{
      const mt = document.createElement('span');
      mt.className = 'mini-tag' + (activeTags.has(t)?' match':'');
      mt.textContent = t;
      tagsDiv.appendChild(mt);
    });
    body.appendChild(tagsDiv);
    if(e.classification && CLASSIFICATION_SYSTEMS[e.classification]){
      const clsRow = document.createElement('div');
      clsRow.className = 'card-classrow';
      clsRow.textContent = `📋 ${CLASSIFICATION_SYSTEMS[e.classification].name}`;
      body.appendChild(clsRow);
    }
    const links = ensureLinks(e);
    if(links.length){
      const linkRow = document.createElement('div');
      linkRow.className = 'card-linkrow';
      linkRow.textContent = `🔗 ${links.length} referência${links.length===1?'':'s'} de imagem`;
      body.appendChild(linkRow);
    }
    card.appendChild(body);

    card.onclick = ()=> openDetail(e.id);
    grid.appendChild(card);
  });
}

function renderAll(){
  renderTree();
  renderHeader();
  renderTagbar();
  renderReviewBar();
  renderResults();
  updateQuizDueBadge();
}

  if(!e) return;
  const links = ensureLinks(e);
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.onclick = (ev)=>{ if(ev.target===ov) closeOverlay(); };
  ov.innerHTML = `
    <div class="modal">
      ${hasEntryImgs(e)?`<div class="detail-img-gallery" id="detail-img-gallery"></div>`:''}

      <div class="detail-meta">${e.s} · ${e.site}</div>

      ${e.classification && CLASSIFICATION_SYSTEMS[e.classification] ? renderClassificationBox(e.classification) : ''}
      ${links.length?`<div class="detail-links">
        <div class="detail-links-label">VER IMAGENS / CASOS</div>

      </div>`:''}

        <div class="review-btn-row" id="review-btn-row"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="btn-del">excluir</button>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" id="btn-close">fechar</button>
          <button class="btn btn-primary" id="btn-edit">editar</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  if(hasEntryImgs(e)){
    getEntryImgs(e).then(imgs=>{
      const gal=document.getElementById('detail-img-gallery'); if(!gal) return;
      const all=imgs.length?imgs:(e.img?[{data:e.img,label:''}]:[]);
      gal.innerHTML=all.map((img,i)=>`<div class="detail-img-item"><img src="${img.data}" data-idx="${i}">${img.label?`<div class="detail-img-label">${img.label.replace(/</g,'&lt;')}</div>`:''}</div>`).join('');
      gal.querySelectorAll('img').forEach(imgEl=>{
        imgEl.addEventListener('click', ()=> openImageLightbox(all[+imgEl.dataset.idx].data));
      });
    });
  }
  function renderReviewButtons(){
    const row = document.getElementById('review-btn-row');
    const current = getReview(e.id);
    row.innerHTML = '';
    [0,1,2].forEach(st=>{
      const b = document.createElement('button');
      b.className = 'review-set-btn' + (st===current?' active':'');
      b.style.borderColor = REVIEW_COLORS[st];
      b.style.color = st===current ? '#0E1720' : REVIEW_COLORS[st];

      b.textContent = `${REVIEW_ICONS[st]} ${REVIEW_LABELS[st]}`;
      b.onclick = ()=>{ setReview(e.id, st); renderReviewButtons(); renderReviewBar(); renderResults(); };
      row.appendChild(b);
    });

  renderReviewButtons();
  document.getElementById('btn-close').onclick = closeOverlay;
  document.getElementById('btn-edit').onclick = ()=>{ closeOverlay(); openForm(e.id); };

      await saveData();
      closeOverlay();
      renderAll();
      toast('Lesão excluída.');
    }
  };
}

          <input id="f-tag-input" placeholder="digite e pressione Enter…">
        </div>
        <div class="suggest-row" id="suggest-row"></div>
      </div>

      <div class="field">
        <label>Termo em inglês para busca (opcional, recomendado)</label>
        <input id="f-en-term" value="${existing?(existing.enTerm||'').replace(/"/g,'&quot;'):''}" placeholder="ex: hepatic hemangioma — o Radiopaedia é em inglês">
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="f-cancel">cancelar</button>
        <button class="btn btn-primary" id="f-save">${existing?'salvar alterações':'adicionar ao banco'}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  // Fechar edição clicando fora da janela ou pressionando Esc.
  ov.addEventListener('click', (ev)=>{
    if(ev.target===ov) closeOverlay();
  });
  const closeFormOnEsc = (ev)=>{
    if(ev.key==='Escape' && ov.isConnected){
      closeOverlay();
      document.removeEventListener('keydown', closeFormOnEsc);
    }
  };
  document.addEventListener('keydown', closeFormOnEsc);

  let tags = existing ? [...existing.tags] : [];
  let links = existing ? [...ensureLinks(existing)] : [];

  function renderLinks(){
    const box = document.getElementById('link-list');
    box.innerHTML = '';
    if(links.length===0){
      box.innerHTML = '<div style="color:var(--muted-2);font-size:12px;padding:2px 0 4px 0;">nenhum link ainda</div>';
    }
    links.forEach((l,i)=>{
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `<span class="link-row-label">${l.label||'referência'}</span><span class="link-row-url">${l.url}</span><button type="button" class="link-row-del">✕</button>`;
      row.querySelector('.link-row-del').onclick = ()=>{ links.splice(i,1); renderLinks(); };
      box.appendChild(row);
    });
  }
  document.getElementById('f-link-add').onclick = ()=>{
    const urlEl = document.getElementById('f-link-url');
    const labelEl = document.getElementById('f-link-label');
    const url = urlEl.value.trim();
    if(!url){ toast('Cole a URL do link.'); return; }
    links.push({label: labelEl.value.trim() || 'Referência', url});
    urlEl.value=''; labelEl.value='';
    renderLinks();
  };
  renderLinks();
  document.getElementById('f-link-radiopaedia').onclick = ()=>{
    const nm = document.getElementById('f-en-term').value.trim() || document.getElementById('f-name').value.trim();
    if(!nm){ toast('Escreva o nome da lesão (ou o termo em inglês) primeiro.'); return; }
    const url = radiopaediaSearchUrl(nm);
    if(links.some(l=>l.url === url)) { toast('Esse link já foi adicionado.'); return; }
    links.push({label:'Radiopaedia — buscar casos', url});
    renderLinks();
  };

  const chipWrap = document.getElementById('chip-wrap');
  const tagInput = document.getElementById('f-tag-input');

  function renderChips(){
    chipWrap.querySelectorAll('.removable-tag').forEach(n=>n.remove());
    tags.forEach(t=>{
      const c = document.createElement('span');
      c.className='removable-tag';
      c.innerHTML = `${t}<button type="button">✕</button>`;
      c.querySelector('button').onclick = ()=>{ tags = tags.filter(x=>x!==t); renderChips(); renderSuggest(); };
      chipWrap.insertBefore(c, tagInput);
    });
  }
  function addTag(t){
    t = t.trim();
    if(t && !tags.includes(t)){ tags.push(t); renderChips(); renderSuggest(); }
    tagInput.value='';
  }
  tagInput.addEventListener('keydown', (ev)=>{
    if(ev.key==='Enter' || ev.key===','){ ev.preventDefault(); addTag(tagInput.value); }
    else if(ev.key==='Backspace' && tagInput.value==='' && tags.length){ tags.pop(); renderChips(); renderSuggest(); }
  });
  function renderSuggest(){
    const row = document.getElementById('suggest-row');
    row.innerHTML = '';
    Object.keys(TAG_GROUPS).forEach(groupName=>{
      const available = TAG_GROUPS[groupName].filter(t=>!tags.includes(t));
      if(available.length===0) return;
      const groupLabel = document.createElement('div');
      groupLabel.className = 'suggest-group-label';
      groupLabel.textContent = groupName;
      row.appendChild(groupLabel);
      const groupRow = document.createElement('div');
      groupRow.className = 'suggest-row-inner';
      available.forEach(t=>{
        const s = document.createElement('span');
        s.className='suggest-chip'; s.textContent='+ '+t;
        s.onclick = ()=> addTag(t);
        groupRow.appendChild(s);
      });
      row.appendChild(groupRow);
    });
  }
  renderChips(); renderSuggest();

  /* --- imagens: Cloudinary por padrão quando configurado; local continua como fallback compatível --- */
  let pendingImgs = [];       // [{label,data,source,...}]
  let imgsChanged = false;
  const imgGallery = document.getElementById('img-gallery');
  const imgFileInput = document.getElementById('img-file-input');
  const imgBox = document.getElementById('img-upload-box');
  const cloudStatus = document.getElementById('img-cloud-status');

  const IMG_PRESET_GROUPS = [
    { title: 'RM', items: ["RM T1","RM T2","RM T1 c/ contraste","RM T2 FLAIR","RM Difusão (DWI)","RM ADC","AngioRM"] },
    { title: 'TC', items: ["TC sem contraste","TC c/ contraste","AngioTC"] },
    { title: 'RX / MMG / US', items: ["RX","MMG","US","Doppler"] },
  ];

  function renderCloudStatus(msg, kind){
    if(msg){ cloudStatus.textContent=msg; cloudStatus.className='img-cloud-status '+(kind||''); return; }
    if(hasCloudinaryConfig()){
      cloudStatus.textContent='☁ Cloudinary ativo — imagens novas serão hospedadas externamente; o Atlas guarda apenas o link.';
      cloudStatus.className='img-cloud-status ok';
    }else{
      cloudStatus.innerHTML='💾 Cloudinary não configurado — imagens novas ficarão locais. <span id="cloudinary-inline" style="text-decoration:underline;cursor:pointer;">configurar agora</span>';
      cloudStatus.className='img-cloud-status warn';
      setTimeout(()=>{ const el=document.getElementById('cloudinary-inline'); if(el) el.onclick=openCloudinarySettings; },0);
    }
  }
  function renderImgGallery(){
    imgGallery.innerHTML = '';
    pendingImgs.forEach((img, idx)=>{
      const item = document.createElement('div');
      item.className = 'img-gallery-item';
      const sourceLabel=img.source==='cloudinary'?'☁ Cloudinary':(img.source==='imgbb'?'☁ ImgBB':(img.source==='url'?'🔗 URL':'💾 local'));
      item.innerHTML = `
        <span class="img-source-badge">${sourceLabel}</span>
        <img src="${img.data}">
        <input class="img-gallery-label" placeholder="descrição da imagem (ex: axial T2, CC, MLO, pós-contraste)" value="${(img.label||'').replace(/"/g,'&quot;')}">
        <div class="img-gallery-preset-groups"></div>
        <button type="button" class="img-gallery-remove" title="remover esta imagem do Atlas">✕</button>
      `;
      const labelInput = item.querySelector('.img-gallery-label');
      labelInput.addEventListener('input', (ev)=>{ pendingImgs[idx].label = ev.target.value; imgsChanged = true; });
      const groupsWrap = item.querySelector('.img-gallery-preset-groups');
      IMG_PRESET_GROUPS.forEach(group=>{
        const groupDiv = document.createElement('div');
        groupDiv.className = 'img-gallery-modality';
        groupDiv.innerHTML = `<div class="img-gallery-modality-title">${group.title}</div><div class="img-gallery-presets"></div>`;
        const row = groupDiv.querySelector('.img-gallery-presets');
        group.items.forEach(preset=>{
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'img-gallery-preset-chip' + (img.label===preset ? ' active' : '');
          chip.textContent = preset;
          chip.onclick = ()=>{ pendingImgs[idx].label = preset; imgsChanged = true; renderImgGallery(); };
          row.appendChild(chip);
        });
        groupsWrap.appendChild(groupDiv);
      });
      item.querySelector('.img-gallery-remove').addEventListener('click', ()=>{
        pendingImgs.splice(idx,1); imgsChanged=true; renderImgGallery();
      });
      imgGallery.appendChild(item);
    });
  }
  if(existing){
    getEntryImgs(existing).then(imgs=>{
      pendingImgs = imgs.map(i=>({...i, label:[i.modality,i.label].filter(Boolean).join(' ').trim(), source:i.source||'local'}));
      renderImgGallery();
    });
  }
  renderCloudStatus();
  document.getElementById('img-pick-btn').onclick = ()=> imgFileInput.click();

  async function handleImgFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    if(hasCloudinaryConfig()){
      try{
        renderCloudStatus('☁ Enviando '+(file.name||'imagem')+' para o Cloudinary…','ok');
        const remote=await uploadToCloudinary(file);
        pendingImgs.push(remote); imgsChanged=true; renderImgGallery(); renderCloudStatus();
      }catch(err){
        console.error('Cloudinary upload',err);
        renderCloudStatus('Falha no Cloudinary: '+err.message+' — nada foi salvo localmente automaticamente.','warn');
        toast('Falha no upload Cloudinary. Verifique cloud name, preset unsigned e conexão.');
      }
    }else{
      try{
        const dataUrl=await resizeImageToDataUrl(file,900,0.78);
        pendingImgs.push({label:'',data:dataUrl,source:'local'}); imgsChanged=true; renderImgGallery();
      }catch(e){ toast('Não consegui processar essa imagem.'); }
    }
  }
  imgFileInput.addEventListener('change', async (e)=>{
    const files=[...e.target.files];
    for(const file of files) await handleImgFile(file);
    e.target.value='';
  });
  imgBox.addEventListener('paste', async (e)=>{
    const items=e.clipboardData&&e.clipboardData.items; if(!items) return;
    const files=[];
    for(const it of items) if(it.type&&it.type.startsWith('image/')) files.push(it.getAsFile());
    if(files.length){ e.preventDefault(); for(const f of files) await handleImgFile(f); }
  });
  imgBox.tabIndex=0;
  document.getElementById('img-add-url').onclick=()=>{
    const el=document.getElementById('f-img'); const url=el.value.trim();
    if(!/^https?:\/\//i.test(url)){ toast('Cole uma URL http/https válida.'); return; }
    pendingImgs.push({label:'',data:url,source:'url'}); imgsChanged=true; el.value=''; renderImgGallery();
  };

  document.getElementById('f-cancel').onclick = ()=>{ document.removeEventListener('keydown', closeFormOnEsc); closeOverlay(); };
  document.getElementById('f-save').onclick = async ()=>{
    const name = document.getElementById('f-name').value.trim();
    const sec = document.getElementById('f-section').value.trim();
    const site = document.getElementById('f-site').value.trim();
    const img = document.getElementById('f-img').value.trim();
    const enTerm = document.getElementById('f-en-term').value.trim();
    const inc = parseInt(document.getElementById('f-inc').value,10) || 2;
    const classification = document.getElementById('f-classification').value || null;
    const notes = document.getElementById('f-notes').value.trim();
    if(!name || !sec || !site){ toast('Preencha nome, seção e sítio.'); return; }
    const entryId = existing ? existing.id : ('u_'+Date.now());
    let localImgFlag = existing ? !!existing.localImg : false;
    let remoteImgs = existing && Array.isArray(existing.images) ? existing.images : [];
    if(imgsChanged){
      const localImgs = pendingImgs.filter(x=>x.source==='local').map(x=>({label:x.label||'',data:x.data}));
      remoteImgs = pendingImgs.filter(x=>x.source!=='local').map(x=>({...x}));
      if(localImgs.length>0){ await setLocalImgs(entryId, localImgs); localImgFlag=true; }
      else { await deleteLocalImg(entryId); localImgFlag=false; }
    }
    if(existing){
      existing.name=name; existing.s=sec; existing.site=site; existing.tags=tags; existing.img=img; existing.notes=notes; existing.links=links; existing.enTerm=enTerm; existing.inc=inc; existing.localImg=localImgFlag; existing.images=remoteImgs; existing.classification=classification;
    } else {
      DATA.push({id:entryId, name, s:sec, site, tags, img, notes, links, enTerm, inc, localImg:localImgFlag, images:remoteImgs, classification});
    }
    await saveData();
    document.removeEventListener('keydown', closeFormOnEsc);
    closeOverlay();
    scope = {section:sec, site:site};
    openSections.add(sec);
    renderAll();
    toast(existing?'Alterações salvas.':'Lesão adicionada ao seu banco.');
  };
}

/* ============================================================
   PREVIEW DE IMAGEM AO PASSAR O MOUSE
   ============================================================ */
let hoverPreviewEl = null;
function ensureHoverPreview(){
  if(!hoverPreviewEl){
    hoverPreviewEl = document.createElement('div');
    hoverPreviewEl.className = 'hover-img-preview';
    hoverPreviewEl.style.display = 'none';
    document.body.appendChild(hoverPreviewEl);
  }
  return hoverPreviewEl;
}
function positionHoverPreview(x, y){
  if(!hoverPreviewEl) return;
  const pad = 16, maxW = 300, maxH = 300;
  let left = x + pad, top = y + pad;
  if(left + maxW > window.innerWidth) left = x - maxW - pad;
  if(top + maxH > window.innerHeight) top = window.innerHeight - maxH - pad;
  hoverPreviewEl.style.left = Math.max(4,left)+'px';
  hoverPreviewEl.style.top = Math.max(4,top)+'px';
}
function showHoverPreview(src, x, y){
  const el = ensureHoverPreview();
  el.innerHTML = `<img src="${src}">`;
  el.style.display = 'block';
  positionHoverPreview(x, y);
}
function hideHoverPreview(){ if(hoverPreviewEl) hoverPreviewEl.style.display = 'none'; }

/* lightbox — expande qualquer imagem de galeria em tela cheia ao clicar */
function openImageLightbox(src){
  const ov = document.createElement('div');
  ov.className = 'overlay lightbox-overlay';
  ov.onclick = ()=> ov.remove();
  ov.innerHTML = `<img src="${src}" class="lightbox-img"><button type="button" class="lightbox-close">✕</button>`;
  document.body.appendChild(ov);
}
function attachThumbHoverPreview(thumbEl, e){
  let srcPromise = null;
  if(hasEntryImgs(e)) srcPromise = getEntryFirstImg(e);
  else return;
  thumbEl.classList.add('has-preview');
  thumbEl.addEventListener('mouseenter', (ev)=>{
    srcPromise.then(src=>{ if(src) showHoverPreview(src, ev.clientX, ev.clientY); }).catch(()=>{});
  });
  thumbEl.addEventListener('mousemove', (ev)=> positionHoverPreview(ev.clientX, ev.clientY));
  thumbEl.addEventListener('mouseleave', hideHoverPreview);
}

/* ============================================================
   MODO QUIZ
   ============================================================ */
let quizQueue = [];
let quizIndex = 0;
let quizStats = {right:0, wrong:0};

function openQuizSetup(){
  const inScope = scopedEntries();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.onclick = (ev)=>{ if(ev.target===ov) closeOverlay(); };
  ov.innerHTML = `
    <div class="modal quiz-setup-modal">
      <h2>🧠 Modo Quiz</h2>
      <div class="quiz-setup-row">
        <label class="quiz-radio"><input type="radio" name="quiz-scope" value="scope" checked> Nesta seleção atual (${inScope.length} lesões)</label>
        <label class="quiz-radio"><input type="radio" name="quiz-scope" value="all"> Todo o acervo (${DATA.length} lesões)</label>
      </div>
      <div class="quiz-setup-row">
        <label class="quiz-check"><input type="checkbox" id="quiz-only-due" checked> Só as pendentes de revisão hoje</label>
        <label class="quiz-check"><input type="checkbox" id="quiz-shuffle" checked> Ordem aleatória</label>
      </div>
      <div id="quiz-count-preview" class="quiz-count-preview"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="quiz-cancel">cancelar</button>
        <button class="btn btn-primary" id="quiz-start">Começar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  function currentCandidates(){
    const useAll = ov.querySelector('input[name="quiz-scope"]:checked').value === 'all';
    let base = useAll ? DATA.slice() : inScope.slice();
    if(document.getElementById('quiz-only-due').checked){
      base = base.filter(e=>isDue(e.id));
    }
    return base;
  }
  function updatePreview(){
    const n = currentCandidates().length;
    document.getElementById('quiz-count-preview').textContent = n>0 ? `${n} lesões nesta sessão (máx. 30 por vez)` : 'Nenhuma lesão com esse filtro — desmarque "só pendentes" ou mude o escopo.';
    document.getElementById('quiz-start').disabled = n===0;
  }
  ov.querySelectorAll('input').forEach(inp=> inp.addEventListener('change', updatePreview));
  updatePreview();

  document.getElementById('quiz-cancel').onclick = closeOverlay;
  document.getElementById('quiz-start').onclick = ()=>{
    let queue = currentCandidates();
    if(document.getElementById('quiz-shuffle').checked){
      for(let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
    } else {
      queue.sort((a,b)=> ((SRS[a.id]&&SRS[a.id].due)||0) - ((SRS[b.id]&&SRS[b.id].due)||0));
    }
    queue = queue.slice(0, 30);
    closeOverlay();
    startQuizSession(queue);
  };
}

function startQuizSession(queue){
  quizQueue = queue;
  quizIndex = 0;
  quizStats = {right:0, wrong:0};
  renderQuizCard();
}

function renderQuizCard(){
  closeOverlay();
  if(quizIndex >= quizQueue.length){
    renderQuizSummary();
    return;
  }
  const e = quizQueue[quizIndex];
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal quiz-modal">
      <div class="quiz-progress">LESÃO ${quizIndex+1} DE ${quizQueue.length} · ✅ ${quizStats.right} · ❌ ${quizStats.wrong}</div>
      <div class="quiz-stage" id="quiz-stage"></div>
      <div id="quiz-reveal-area"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="quiz-quit">encerrar sessão</button>
        <button class="btn btn-primary" id="quiz-reveal-btn">Revelar resposta</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const stage = document.getElementById('quiz-stage');
  if(hasEntryImgs(e)){
    stage.innerHTML = `<div class="quiz-img-gallery" id="quiz-img-gallery"></div><div class="quiz-meta-hint">${e.s} · ${e.site}</div>`;
    getEntryImgs(e).then(imgs=>{
      const gal=document.getElementById('quiz-img-gallery'); if(!gal) return;
      const all=imgs.length?imgs:(e.img?[{data:e.img,label:''}]:[]);
      gal.innerHTML=all.map((img,i)=>`<div class="quiz-img-item"><img src="${img.data}" data-idx="${i}">${img.label?`<div class="quiz-img-label">${img.label.replace(/</g,'&lt;')}</div>`:''}</div>`).join('');
      gal.querySelectorAll('img').forEach(imgEl=>{
        imgEl.addEventListener('click', ()=> openImageLightbox(all[+imgEl.dataset.idx].data));
      });
    });
  } else {
    const links = ensureLinks(e);
    stage.innerHTML = `
      <div class="quiz-meta-hint">${e.s} · ${e.site}</div>
      <div class="detail-tags">${e.tags.map(t=>`<span class="mini-tag match">${t}</span>`).join('')}</div>
      <div class="inc-badge" style="background:${incColor(e.inc||2)}22;color:${incColor(e.inc||2)};border-color:${incColor(e.inc||2)}55;margin-top:10px;display:inline-block;">${incLabel(e.inc||2)}</div>
      ${links.length?`<a class="detail-link quiz-radiopaedia-link" href="${links[0].url}" target="_blank" rel="noopener">↗ Ver imagens no Radiopaedia</a>`:''}
    `;
  }

  document.getElementById('quiz-quit').onclick = ()=>{ closeOverlay(); renderAll(); };
  document.getElementById('quiz-reveal-btn').onclick = ()=>{
    document.getElementById('quiz-reveal-btn').style.display='none';
    const area = document.getElementById('quiz-reveal-area');
    const links = ensureLinks(e);
    area.innerHTML = `
      <div class="detail-title-row"><h2>${e.name}</h2></div>
      <div class="detail-tags">${e.tags.map(t=>`<span class="mini-tag match">${t}</span>`).join('')}</div>
      <div class="detail-notes">${(e.notes||'').replace(/</g,'&lt;')}</div>
      ${e.classification && CLASSIFICATION_SYSTEMS[e.classification] ? renderClassificationBox(e.classification) : ''}
      ${!hasEntryImgs(e) ? `<button class="btn btn-ghost quiz-add-img-btn" id="quiz-add-img">+ colar imagem desta lesão</button>` : ''}
      <div class="quiz-grade-row">
        <button class="btn quiz-grade-wrong" id="quiz-wrong">❌ Não sabia</button>
        <button class="btn quiz-grade-right" id="quiz-right">✅ Acertei</button>
      </div>
    `;
    if(!hasEntryImgs(e)){
      document.getElementById('quiz-add-img').onclick = ()=>{ closeOverlay(); openForm(e.id); };
    }
    document.getElementById('quiz-wrong').onclick = ()=>{ srsGrade(e.id, false); quizStats.wrong++; quizIndex++; renderQuizCard(); };
    document.getElementById('quiz-right').onclick = ()=>{ srsGrade(e.id, true); quizStats.right++; quizIndex++; renderQuizCard(); };
  };
}

function renderQuizSummary(){
  logSessionResult(quizStats.right, quizStats.wrong);
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal quiz-modal" style="text-align:center;">
      <h2>Sessão concluída 🎉</h2>
      <div class="quiz-summary-stats">
        <div class="quiz-stat"><span class="n" style="color:var(--teal)">${quizStats.right}</span>acertos</div>
        <div class="quiz-stat"><span class="n" style="color:#E8935B">${quizStats.wrong}</span>a revisar</div>
      </div>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-primary" id="quiz-finish">fechar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  document.getElementById('quiz-finish').onclick = ()=>{ closeOverlay(); renderAll(); };
}

function updateQuizDueBadge(){
  const badge = document.getElementById('quiz-due-badge');
  if(!badge) return;
  const n = countDue(DATA);
